[project]
name = "experiment-tracker"
version = "2.0.0"
description = "Lightweight experiment tracking on SQLite, with no dependencies"
readme = "README.md"
authors = [
    { name = "Jacob Eliason", email = "jacobeliason@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
expt = "experiment_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_tracker"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
    "numpy>=2.2.3"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
